<html>
    <head>
        <title>Products</title>
        <script>
            var products = [
                { name: "Coca Cola", price: 10.99, image:"https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSOXQtM9_3pIb9c4KCWM0-dsDdtRviHFiCKiFTwKexxhg&s=10"    },
                { name: "Pepsi", price: 19.99, image:"https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTznPAynR2wP2JdDQfUHal9X3Q4Pnu91mSaZAmobSgtAA&s" },
                { name: "Sting", price: 5.99, image:"https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTnMNyKwexw50saGa9L_wDCHjFPsDFJHO8ygnI7evz5fA&s=10" }
            ];
        </script>
         <script>
            function loadProducts() {
                var tableBody = document.getElementById("productTableBody");
                tableBody.innerHTML = "";
                for (var i = 0; i < products.length; i++) {
                    prodt=products[i];
                    // tạo một hành mới
                    tr=document.createElement("tr");
                    // tạo các ô dữ liệu
                    tdName=document.createElement("td");
                    tdName.innerHTML=prodt.name;
                    tdPrice=document.createElement("td");
                    tdPrice.innerHTML=prodt.price;
                    tdImage=document.createElement("td");
                    tdImage.innerHTML="<img src='" + prodt.image + "' alt='" + prodt.name + "' width='100'>";
                    // thêm các ô vào hàng
                    tr.appendChild(tdName);
                    tr.appendChild(tdPrice);
                    tr.appendChild(tdImage);
                    // thêm hàng vào bảng
                    tableBody.appendChild(tr);
                }
            }
        </script>
    </head>
    <body>
        <button onclick="loadProducts()">Load Products</button>
        <table border="1">
            <thead>
                <tr>
                    <th>Product Name</th>
                    <th>Price</th>
                    <th>Image</th>
                </tr>
            </thead>
            <tbody id="productTableBody">
            </tbody>
        </table>
    </body>
</html>
