<html>
    <head>
        <title>Product - Lê Trọng Phúc</title>
    </head>
    <body>
        <table border="1">
            <tr>
                <td>Product ID</td>
                <td>
                    <input type="text" id="txtProductID">
                </td>
            </tr>
            <tr>
                <td>Product Name</td>
                <td>
                    <input type="text" id="txtProductName">
                </td>
            </tr>
            <tr>
                <td>Product Quantity</td>
                <td>
                    <input type="text" id="txtProductQuantity">
                </td>
            </tr>
            <tr>
                <td>Product Price</td>
                <td>
                    <input type="text" id="txtProductPrice">
                </td>
            </tr>
            <tr>
                <td colspan="2" style="text-align: center;">
                    <button onclick="addProduct()">Add Product</button>
                </td>
            </tr>
        </table>
        <br>
        <table border="1">
            <tr>
                <th>Product ID</th>
                <th>Product Name</th>
                <th>Product Quantity</th>
                <th>Product Price</th>
            </tr>
            <tbody id="tblProduct"></tbody>
        </table>
        <script>
            function addProduct() {
                var id = document.getElementById("txtProductID").value;
                var name = document.getElementById("txtProductName").value;
                var quantity = document.getElementById("txtProductQuantity").value;
                var price = document.getElementById("txtProductPrice").value;

                var tblProduct = document.getElementById("tblProduct");

                var row = tblProduct.insertRow();

                var cell1 = row.insertCell(0);
                var cell2 = row.insertCell(1);
                var cell3 = row.insertCell(2);
                var cell4 = row.insertCell(3);

                cell1.innerHTML = id;
                cell2.innerHTML = name;
                cell3.innerHTML = quantity;
                cell4.innerHTML = price;
                document.getElementById("txtProductID").value = "";
                document.getElementById("txtProductName").value = "";
                document.getElementById("txtProductQuantity").value = "";
                document.getElementById("txtProductPrice").value = "";
            }
        </script>
    </body>
</html>
